name: Build Desktop (Windows exe) → Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

# Évite deux publications desktop simultanées sur la même branche/tag.
concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check_release:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check whether this desktop version is already published
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('desktop/package.json', 'utf8'));
            const tag = `v${pkg.version}`;
            try {
              const { data: release } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag
              });
              if (!release.draft) {
                core.info(`Release ${tag} déjà publiée : on ne reconstruit pas sous le même tag.`);
                core.setOutput('should_build', 'false');
                return;
              }
              core.info(`Release ${tag} en brouillon : on reprend la publication.`);
            } catch (error) {
              if (error.status !== 404) throw error;
              core.info(`Nouvelle release ${tag} : la publication peut continuer.`);
            }
            core.setOutput('should_build', 'true');

  build-windows:
    needs: check_release
    if: needs.check_release.outputs.should_build == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Generate Prisma client (moteur Windows)
        run: bunx prisma generate

      - name: Generate SQLite Prisma client (app desktop)
        run: bunx prisma generate --schema prisma/schema.sqlite.prisma

      - name: Create embedded template database
        shell: bash
        run: |
          # NB : Prisma résout les chemins SQLite relatifs PAR RAPPORT au
          # dossier du schema (prisma/) — d'où "../db/".
          # Le schéma SQLite (schema.sqlite.prisma) est le miroir du schéma
          # Postgres — il faut le préciser, sinon Prisma utilise le schéma
          # Postgres par défaut et échoue avec une URL SQLite.
          mkdir -p db
          export DATABASE_URL="file:../db/desktop-template.db"
          bunx prisma db push --schema prisma/schema.sqlite.prisma --accept-data-loss --skip-generate
          ls -la db/

      - name: Build Next.js (standalone)
        shell: bash
        env:
          DATABASE_URL: file:../db/desktop-template.db
          # Garde fail-fast de reset-tokens.ts au CHARGEMENT DU MODULE :
          # `next build` collecte les pages de données des routes (dont
          # /api/auth/forgot-password) → sans ces secrets le build s'arrête
          # sur « RESET_TOKEN_SECRET manquante ou trop courte ».
          RESET_TOKEN_SECRET: ci-reset-secret-0123456789abcdef0123456789abcdef
          PAYMENT_KEYS_SECRET: ci-payment-keys-secret-abcdef0123456789
        run: |
          set -e
          bunx next build
          # Assets statiques + paquets dynamiques (pdfkit → PDF, better-sqlite3
          # → import-db) dans le standalone : sans eux, MODULE_NOT_FOUND dans
          # l'EXE (resources/app n'a aucun node_modules parent).
          node scripts/copy-standalone-assets.mjs

      - name: Build Windows executables (electron-builder)
        shell: bash
        run: |
          cd desktop
          npm install
          npx electron-builder --win --publish never

      # `build.files` est une liste BLANCHE : tout module requis par main.js
      # et absent de cette liste n'est PAS empaqueté dans app.asar, et l'EXE
      # installé s'ouvre alors sur une fenêtre « Error » (Cannot find module).
      # Régression observée le 07/10 avec pdf-store.js et deep-link.js.
      - name: Verify runtime files inside app.asar
        shell: pwsh
        run: |
          $asar = Get-ChildItem desktop\dist -Recurse -Filter app.asar | Select-Object -First 1
          if (-not $asar) { Write-Error "app.asar introuvable dans desktop/dist"; exit 1 }
          Write-Host "Verification de $($asar.FullName)"
          $list = node desktop\node_modules\@electron\asar\bin\asar.js list $asar.FullName
          if ($LASTEXITCODE -ne 0) { Write-Error "lecture de app.asar impossible"; exit 1 }
          $required = 'main.js','preload.js','package.json','icon.png','splash-logo.png','pdf-store.js','deep-link.js'
          $missing = @()
          foreach ($f in $required) {
            if ($list -contains ("\{0}" -f $f)) { Write-Host "  OK    $f" }
            else { Write-Host "  MANQUE $f"; $missing += $f }
          }
          if ($missing.Count -gt 0) { Write-Error ("Absent(s) de app.asar : " + ($missing -join ', ')); exit 1 }

      - name: Verify update metadata and Setup SHA-512
        shell: bash
        run: |
          set -euo pipefail
          ls -la desktop/dist/
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');

          const version = require('./desktop/package.json').version;
          const metadataPath = 'desktop/dist/latest.yml';
          const fileName = `Kelasi360-Setup-${version}.exe`;
          const binaryPath = path.join('desktop/dist', fileName);

          if (!fs.existsSync(metadataPath)) throw new Error('latest.yml absent — publication refusée.');
          if (!fs.existsSync(binaryPath)) throw new Error(`${fileName} absent — publication refusée.`);

          const yaml = fs.readFileSync(metadataPath, 'utf8');
          const versionMatch = yaml.match(/^version:\s*([^\r\n]+)$/m);
          const metadataVersion = String(versionMatch?.[1] || '').trim().replace(/^v/, '');
          if (metadataVersion !== version) {
            throw new Error(`Version incohérente : package.json=${version}, latest.yml=${metadataVersion || '(absente)'}.`);
          }

          // Read the checksum associated specifically with the NSIS Setup EXE.
          // latest.yml can also contain a top-level legacy path/sha512 pair.
          let inTarget = false;
          let expected = null;
          let expectedSize = null;
          for (const line of yaml.split(/\r?\n/)) {
            const fileMatch = line.match(/^\s*-\s*url:\s*["']?([^"']+?)["']?\s*$/);
            if (fileMatch) {
              inTarget = path.basename(fileMatch[1].trim()) === fileName;
              continue;
            }
            if (inTarget) {
              const shaMatch = line.match(/^\s*sha512:\s*(\S+)\s*$/);
              const sizeMatch = line.match(/^\s*size:\s*(\d+)\s*$/);
              if (shaMatch) expected = shaMatch[1];
              if (sizeMatch) expectedSize = Number(sizeMatch[1]);
            }
          }
          const legacyPath = yaml.match(/^path:\s*["']?([^"\r\n"']+)["']?\s*$/m)?.[1]?.trim();
          const legacySha = yaml.match(/^sha512:\s*(\S+)\s*$/m)?.[1];
          if (!expected && legacyPath && path.basename(legacyPath) === fileName) expected = legacySha || null;

          if (!expected) {
            throw new Error(`latest.yml ne fournit aucun sha512 pour ${fileName}.`);
          }

          const hash = crypto.createHash('sha512');
          const actual = await new Promise((resolve, reject) => {
            const stream = fs.createReadStream(binaryPath);
            stream.on('data', chunk => hash.update(chunk));
            stream.on('error', reject);
            stream.on('end', () => resolve(hash.digest('base64')));
          });
          if (actual !== expected) {
            throw new Error(`SHA-512 incohérent avant publication pour ${fileName}: latest.yml ne correspond pas au binaire.`);
          }

          const actualSize = fs.statSync(binaryPath).size;
          if (expectedSize && expectedSize !== actualSize) {
            throw new Error(`Taille incohérente pour ${fileName}: latest.yml=${expectedSize}, fichier=${actualSize}.`);
          }
          console.log(`SHA-512 OK : ${fileName} | version ${version} | ${actualSize} octets`);
          NODE

      - name: Read desktop version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./desktop/package.json').version")" >> "$GITHUB_OUTPUT"

      # Vérifie une seconde fois après la compilation : une autre exécution
      # ne doit pas avoir publié ce tag entre le pré-contrôle et l'upload.
      - name: Ensure release tag is still unpublished
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('desktop/package.json', 'utf8'));
            const tag = `v${pkg.version}`;
            // BUGFIX : getReleaseByTag ne retourne QUE les releases PUBLIÉES
            // (404 sur un brouillon — doc GitHub « Get a published release »).
            // On liste (les brouillons sont visibles avec push access) pour
            // voir les brouillons laissés par une exécution échouée.
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            const sameTag = releases.filter(r => r.tag_name === tag);
            if (sameTag.some(r => !r.draft)) {
              throw new Error(`La release ${tag} vient d'être publiée; upload annulé pour protéger ses checksums.`);
            }
            // Nettoie les brouillons des échecs précédents : softprops ne peut
            // pas les voir non plus et en créerait un doublon à chaque run.
            for (const stale of sameTag) {
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: stale.id
              });
              core.info(`Brouillon ${tag} (#${stale.id}) d'une exécution précédente supprimé.`);
            }
            core.info(`Tag ${tag} non publié; upload autorisé.`);

      # ─── L'exe est publié DIRECTEMENT dans une Release GitHub ───
      - name: Publish exe to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Kelasi 360 Desktop v${{ steps.version.outputs.version }}
          body: |
            ## 🖥️ Kelasi 360 Desktop — application de bureau Windows

            **Téléchargez et installez :**
            - **`Kelasi360-Setup-${{ steps.version.outputs.version }}.exe`** — installateur Windows (recommandé, démarrage rapide)
            - **`Kelasi360-Portable-${{ steps.version.outputs.version }}.exe`** — version portable (décompression à chaque lancement, plus lente)

            ## Inclus dans cette version

            - ✅ **Logo officiel inchangé partout** : écran de démarrage, page de connexion, icône de l'app, favicon, reçus et bulletins PDF
            - ✅ **Démarrage éclair** : splash instantané avec le vrai logo + étapes de chargement en temps réel (base → serveur → interface)
            - ✅ **Localisation automatique de l'école** : détection GPS puis par IP (fonctionne dans l'app desktop) + bouton « Me localiser » réparé
            - ✅ Application **100 % hors ligne** — base de données SQLite locale connectée (`%APPDATA%\EduGest\edugest.db`)
            - ✅ **Mode hors ligne complet** : travaillez sans internet ; les changements (élèves, notes, frais, paiements, comptes) partent **automatiquement** vers la plateforme au retour du réseau
            - ✅ **Interface « Synchronisation » dans les Réglages** : état en direct (en attente / synchronisé), dernières modifications en attente et historique des envois
            - ✅ Envoi par paquets successifs avec reprise propre après coupure (aucune donnée perdue ni dupliquée)
            - ✅ **« Trouver mon école »** à la connexion + import de la base de données de l'école (`.db`) en popup après connexion
            - ✅ **QR codes parents** avec durée de vie paramétrable (1 h → 1 an) — le parent scanne, retrouve son enfant et crée son compte
            - ✅ **Bulletins & reçus** au design premium (gianelli) avec **QR code unique** — le scan confirme que le document est **officiel**
            - ✅ Secrétaire : accès « Mon Abonnement » masqué, non comptée dans le forfait
            - ✅ Admin freemium : changement de formule fonctionnel
            - ✅ Connexion unifiée (parents, personnel, direction) — sans indice de rôle

            ## Notes

            - ✅ **Mise à jour intégrée** : l'application installée propose la nouvelle version toute seule (bannière dans l'app), sans quitter Kelasi 360 — les données sont conservées.
            - La désinstallation ne supprime **pas** les données (`%APPDATA%\EduGest\`).
            - L'administrateur peut importer/mettre à jour sa base à tout moment depuis l'app.
            - Au tout premier lancement, l'ouverture peut prendre quelques instants (analyse antivirus Windows) — le splash affiche la progression.
          # latest.yml + blockmap : INDISPENSABLES à la détection de MAJ par
          # electron-updater (version installée). Sans eux, la bannière in-app
          # n'apparaît jamais sur les installations NSIS.
          files: |
            desktop/dist/*.exe
            desktop/dist/latest.yml
            desktop/dist/*.blockmap
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          overwrite_files: true

      # Le release tag reste invisible sous /releases/latest tant que les
      # exécutables ET latest.yml ne sont pas tous uploadés. On publie seulement
      # après avoir vérifié les noms d'assets requis — aucun client ne peut lire
      # un nouveau checksum pendant que le .exe est encore en train de changer.
      - name: Publish release after all assets are uploaded
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('desktop/package.json', 'utf8'));
            const tag = `v${pkg.version}`;
            // BUGFIX : getReleaseByTag renvoie 404 tant que la release est en
            // brouillon (doc GitHub : « Get a published release ») — l'étape
            // échouait donc systématiquement. On liste (brouillons inclus avec
            // push access) et on filtre par tag.
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            const release = releases.find(r => r.tag_name === tag && r.draft)
              || releases.find(r => r.tag_name === tag);
            if (!release) {
              throw new Error(`Release ${tag} introuvable après upload — le brouillon a disparu.`);
            }
            const names = new Set((release.assets || []).map(asset => asset.name));
            const required = [
              `Kelasi360-Setup-${pkg.version}.exe`,
              `Kelasi360-Portable-${pkg.version}.exe`,
              'latest.yml'
            ];
            const missing = required.filter(name => !names.has(name));
            if (missing.length) {
              throw new Error(`Release ${tag} incomplète. Assets manquants : ${missing.join(', ')}`);
            }

            // Second integrity barrier: compare the SHA-256 digest GitHub
            // reports for every uploaded binary/metadata file against the
            // exact files generated by this run. Never publish a release if
            // an upload is stale, mixed between builds, truncated, or altered.
            const crypto = require('crypto');
            async function sha256File(filePath) {
              const hash = crypto.createHash('sha256');
              await new Promise((resolve, reject) => {
                const stream = fs.createReadStream(filePath);
                stream.on('data', chunk => hash.update(chunk));
                stream.on('error', reject);
                stream.on('end', resolve);
              });
              return hash.digest('hex');
            }
            const { data: uploadedAssets } = await github.rest.repos.listReleaseAssets({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              per_page: 100
            });
            const localFiles = [
              `Kelasi360-Setup-${pkg.version}.exe`,
              `Kelasi360-Portable-${pkg.version}.exe`,
              'latest.yml'
            ];
            for (const name of localFiles) {
              const uploaded = uploadedAssets.find(asset => asset.name === name);
              if (!uploaded) throw new Error(`Asset ${name} absent de la release brouillon ${tag}.`);
              const remoteDigest = String(uploaded.digest || '');
              if (!/^sha256:[0-9a-f]{64}$/i.test(remoteDigest)) {
                throw new Error(`GitHub ne fournit pas de digest SHA-256 exploitable pour ${name}; release conservée en brouillon.`);
              }
              const localDigest = await sha256File(path.join('desktop/dist', name));
              const expectedDigest = remoteDigest.slice('sha256:'.length).toLowerCase();
              if (localDigest !== expectedDigest) {
                throw new Error(`SHA-256 distant différent du build local pour ${name}; release conservée en brouillon.`);
              }
              core.info(`SHA-256 distant vérifié : ${name}`);
            }

            const published = await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              draft: false,
              prerelease: false,
              make_latest: 'true'
            });
            core.info(`Release ${tag} publiée avec ${required.length} assets vérifiés.`);

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kelasi360-Windows
          path: |
            desktop/dist/*.exe
            desktop/dist/latest.yml
            desktop/dist/*.blockmap
          if-no-files-found: error
