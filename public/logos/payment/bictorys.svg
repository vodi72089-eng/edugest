<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Bictorys">
  <!-- Marque Bictorys : carré arrondi vert de marque + « b » stylisé (boucle + fût) -->
  <defs>
    <linearGradient id="bicGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1DC9A0"/>
      <stop offset="1" stop-color="#0E7C66"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bicGrad)"/>
  <!-- fût du b -->
  <rect x="19" y="12" width="7.5" height="40" rx="3.75" fill="#ffffff"/>
  <!-- boucle du b -->
  <circle cx="33" cy="39" r="12.5" fill="none" stroke="#ffffff" stroke-width="7.5"/>
</svg>
