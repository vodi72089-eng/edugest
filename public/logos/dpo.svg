<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="40" fill="white"/>

  <!-- DPO Group origami bird (low-polygon, blue gradient) -->
  <g transform="translate(35, 50)">
    <!-- Bird body facets - dark blue -->
    <path d="M0 30 L25 10 L35 30 L20 45 Z" fill="#1A5F8C"/>
    <!-- Wing facet - medium blue -->
    <path d="M25 10 L55 5 L45 25 L35 30 Z" fill="#2E7DB8"/>
    <!-- Head/beak facet - light blue -->
    <path d="M55 5 L70 15 L55 22 L45 25 Z" fill="#4A9FD4"/>
    <!-- Tail facet - dark blue -->
    <path d="M0 30 L20 45 L10 55 L0 45 Z" fill="#1A5F8C"/>
    <!-- Lower wing - medium blue -->
    <path d="M20 45 L45 25 L50 40 L35 50 Z" fill="#2E7DB8"/>
  </g>

  <!-- "DPO" text - each letter different color -->
  <text x="100" y="105" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="900" letter-spacing="2">
    <tspan fill="#C1272D">D</tspan><tspan fill="#7A2C91">P</tspan><tspan fill="#1A5F8C">O</tspan>
  </text>

  <!-- "Think Payments" tagline -->
  <text x="100" y="130" text-anchor="middle" fill="#1A5F8C" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" letter-spacing="1">Think Payments</text>
</svg>
