<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="40" fill="white"/>
  <!-- Flutterwave three intertwined loops (trefoil-like mark) -->
  <!-- Green loop (#009A46) -->
  <path d="M100 45 C 65 45, 50 75, 55 105 C 58 125, 75 140, 95 135 C 110 131, 118 118, 115 105 C 112 93, 100 88, 88 92" fill="none" stroke="#009A46" stroke-width="14" stroke-linecap="round"/>
  <!-- Orange loop (#F5A623) -->
  <path d="M100 45 C 135 45, 150 75, 145 105 C 142 125, 125 140, 105 135 C 90 131, 82 118, 85 105 C 88 93, 100 88, 112 92" fill="none" stroke="#F5A623" stroke-width="14" stroke-linecap="round"/>
  <!-- Pink/Magenta loop (#E6007E) - bottom loop -->
  <path d="M60 100 C 55 130, 75 155, 100 155 C 125 155, 145 130, 140 100" fill="none" stroke="#E6007E" stroke-width="14" stroke-linecap="round"/>
  <!-- "flutterwave" wordmark at bottom -->
  <text x="100" y="185" text-anchor="middle" fill="#1A365D" font-size="13" font-weight="700" font-family="Arial,Helvetica,sans-serif" letter-spacing="0.5">flutterwave</text>
</svg>
