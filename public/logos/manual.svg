<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="mn-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#43A047"/>
      <stop offset="100%" style="stop-color:#2E7D32"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="44" fill="url(#mn-grad)"/>
  <!-- Banknote -->
  <g transform="translate(100,68)">
    <rect x="-34" y="-22" width="68" height="44" rx="6" fill="none" stroke="white" stroke-width="3.5"/>
    <circle cx="0" cy="0" r="14" fill="none" stroke="white" stroke-width="2.5"/>
    <text x="0" y="7" text-anchor="middle" fill="white" font-size="18" font-weight="700" font-family="Arial,sans-serif">$</text>
    <!-- Corner decorations -->
    <line x1="-28" y1="-16" x2="-20" y2="-16" stroke="white" stroke-width="2" opacity="0.6"/>
    <line x1="20" y1="-16" x2="28" y2="-16" stroke="white" stroke-width="2" opacity="0.6"/>
    <line x1="-28" y1="16" x2="-20" y2="16" stroke="white" stroke-width="2" opacity="0.6"/>
    <line x1="20" y1="16" x2="28" y2="16" stroke="white" stroke-width="2" opacity="0.6"/>
  </g>
  <!-- "Cash" text -->
  <text x="100" y="138" text-anchor="middle" fill="white" font-size="26" font-weight="700" font-family="'Helvetica Neue',Arial,sans-serif" letter-spacing="2">Cash</text>
  <text x="100" y="162" text-anchor="middle" fill="white" font-size="13" font-weight="400" font-family="Arial,sans-serif" opacity="0.8">Paiement Manuel</text>
</svg>