<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="40" fill="#FF7900"/>
  <!-- White card with Orange brand layout -->
  <rect x="35" y="55" width="130" height="90" rx="8" fill="white"/>
  <!-- Orange top bar (brand color) -->
  <rect x="35" y="55" width="130" height="32" rx="8" fill="#FF7900"/>
  <rect x="35" y="79" width="130" height="8" fill="#FF7900"/>
  <!-- "orange" wordmark (white on orange bar) -->
  <text x="100" y="78" text-anchor="middle" fill="white" font-size="20" font-weight="700" font-family="Arial,Helvetica,sans-serif" font-style="italic">orange</text>
  <!-- "Money" text (black on white) -->
  <text x="100" y="128" text-anchor="middle" fill="#000000" font-size="26" font-weight="700" font-family="Arial,Helvetica,sans-serif">Money</text>
</svg>
